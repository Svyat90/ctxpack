<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ctxpack</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Texts come from i18n.js: data-i18n (text), data-i18n-ph (placeholder), data-i18n-aria, data-i18n-title -->
<div class="app">
  <header class="bar">
    <div class="brand"><i></i>ctxpack</div>
    <div class="proj" id="proj" data-i18n="loading">Loading…</div>
    <div class="grow"></div>
    <div class="seg" role="group" data-i18n-aria="budgetProfile" id="budgets"></div>
    <div class="seg" role="group" data-i18n-aria="language" id="langs">
      <button type="button" data-act="lang" data-v="en" aria-pressed="false">EN</button>
      <button type="button" data-act="lang" data-v="uk" aria-pressed="false">УКР</button>
    </div>
  </header>

  <main class="grid">
    <section class="panel" data-i18n-aria="panelFiles">
      <div class="ph"><h2 data-i18n="panelFiles">Files</h2><span class="count" id="selCount"></span></div>
      <div class="tools">
        <input type="search" id="q" data-i18n-ph="searchPath" data-i18n-aria="searchFiles">
        <button class="chip" type="button" data-act="changed" id="changedBtn" data-i18n="changed">Changed in git</button>
        <button class="chip" type="button" data-act="clear" data-i18n="clear">Clear</button>
        <button class="chip" type="button" data-act="openAll" id="openAll">Collapse</button>
      </div>
      <div class="tools">
        <select id="preset" data-i18n-aria="preset"><option value=""></option></select>
        <input type="text" id="presetName" data-i18n-ph="presetNamePh" data-i18n-aria="presetNamePh">
        <button class="chip" type="button" data-act="savePreset" data-i18n="save">Save</button>
        <button class="chip" type="button" data-act="deletePreset" id="delPreset" data-i18n="delete" hidden>Delete</button>
      </div>
      <div id="tree" class="scroll fill-y"></div>
    </section>

    <div class="gutter" data-i="0" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="gutter0" data-i18n-title="gutterTitle"></div>

    <section class="panel" data-i18n-aria="panelRelated">
      <div class="ph"><h2 data-i18n="panelRelated">Related files</h2><span class="count" id="relCount"></span></div>
      <div class="pb opts">
        <div class="line">
          <label class="switch" for="relOn"><input type="checkbox" id="relOn" checked> <span data-i18n="relOn">Suggest related files</span></label>
          <label class="switch" for="depth"><span data-i18n="depth">Depth</span>
            <select id="depth">
              <option value="1" data-i18n="depthDirect">1 · direct</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5" data-i18n="depthMax">5 · maximum</option>
            </select>
          </label>
        </div>
        <div class="rules" id="rules"></div>
        <p class="note" data-i18n="noPackages"></p>
      </div>
      <div id="relBody" class="fill-y"></div>
    </section>

    <div class="gutter" data-i="1" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="gutter1" data-i18n-title="gutterTitle"></div>

    <section class="panel" data-i18n-aria="panelResult">
      <div class="ph"><h2 data-i18n="panelResult">Result</h2><span class="count">.md</span></div>
      <div class="pb stack fill-y">
        <div class="meter" id="meter"></div>
        <div>
          <label class="lbl" for="task" data-i18n="taskLabel"></label>
          <textarea id="task" data-i18n-ph="taskPh"></textarea>
        </div>
        <div class="warns" id="warns"></div>
        <div id="heavyWrap" hidden>
          <div class="lbl-row"><span class="lbl" data-i18n="selectedFiles"></span>
            <div class="seg sm" role="group" data-i18n-aria="fileOrder" id="fOrder">
              <button type="button" data-act="fOrder" data-v="size" data-i18n="bySize" aria-pressed="false"></button>
              <button type="button" data-act="fOrder" data-v="tree" data-i18n="byTree" aria-pressed="false"></button>
            </div>
          </div>
          <div class="heavy" id="heavy"></div>
        </div>
        <div id="partsWrap" hidden><div class="lbl" data-i18n="partsLabel"></div><div class="parts" id="parts"></div></div>
        <div class="actions">
          <button class="btn solid" type="button" data-act="copy" id="copyBtn">Copy MD</button>
          <button class="btn ghost" type="button" data-act="save" data-i18n="saveFile">Save to file</button>
          <button class="btn ghost" type="button" data-act="openResult" data-i18n="viewResult">View result</button>
        </div>
        <div class="toggles">
          <label class="chk" for="split"><input type="checkbox" id="split"> <span data-i18n="split">Split to fit the limit</span></label>
          <label class="chk" for="stripDocs"><input type="checkbox" id="stripDocs" checked> <span data-i18n="stripDocs"></span></label>
          <label class="chk" for="stripComments"><input type="checkbox" id="stripComments"> <span data-i18n="stripComments"></span></label>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- One viewer for both a single file and the generated Markdown -->
<dialog id="viewer" aria-labelledby="vTitle">
  <div class="pk-head">
    <div class="pk-title"><span id="vTitle" class="mono"></span><span id="vMeta" class="tok"></span></div>
    <div class="search">
      <input type="search" id="vQ" data-i18n-ph="searchText" data-i18n-aria="searchTextAria" autocomplete="off">
      <span id="vCount" class="tok" aria-live="polite"></span>
      <button class="btn ghost" type="button" data-act="vPrev" id="vPrev" data-i18n-aria="prevMatch" data-i18n-title="prevMatch">↑</button>
      <button class="btn ghost" type="button" data-act="vNext" id="vNext" data-i18n-aria="nextMatch" data-i18n-title="nextMatch">↓</button>
    </div>
    <div class="actions">
      <button class="btn ghost" type="button" data-act="vRestore" id="vRestore" data-i18n="restoreOriginal" hidden></button>
      <button class="btn solid" type="button" data-act="vToggle" id="vToggle"></button>
      <a class="btn ghost" id="vIde" href="#" data-i18n-title="openIde">PhpStorm</a>
      <button class="btn solid" type="button" data-act="copyPart" data-i="1" id="vCopy"></button>
      <button class="btn ghost" type="button" data-act="vClose" data-i18n-aria="close">×</button>
    </div>
  </div>
  <div id="vWarn"></div>
  <div class="parts v-tabs" id="vTabs"></div>
  <div class="pk-body">
    <nav class="v-nav" id="vNav" data-i18n-aria="navFiles" hidden></nav>
    <div class="v-gutter" id="vGutter" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="navGutter" data-i18n-title="gutterTitle" hidden></div>
    <div class="pk-code" id="vScroll"><pre id="vCode" class="code" tabindex="0"></pre></div>
  </div>
  <button class="btn solid cut-btn" type="button" data-act="vCut" id="vCutBtn" hidden></button>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<div class="pop" id="relPop" role="tooltip" hidden></div>
<script src="/i18n.js"></script>
<script src="/highlight.js"></script>
<script src="/app.js"></script>
</body>
</html>
